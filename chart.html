<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Order Flow Analysis · Chart</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#e7eaf0;background:#1b2130}
*{box-sizing:border-box}
body{margin:0;background:#1b2130;color:#e7eaf0}
main{max-width:1500px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#8e98aa}
h1{font-size:22px;margin:6px 0 3px}
p{font-size:12px;color:#9da6b8;margin:0}
a{color:#dfe6f5}
#chart{width:100%;height:calc(100vh - 130px);min-height:520px;border:1px solid rgba(255,255,255,.10);background:#1b2130}
.status{font-size:11px;color:#9da6b8;margin-top:8px}
.status.error{color:#ffb4b4}
@media(max-width:720px){main{padding:10px}#chart{height:calc(100vh - 150px);min-height:440px}header{display:block}}
</style>
</head>
<body>
<main>
<header>
  <div>
    <div class="eyebrow">ORDER FLOW ANALYSIS / CHART C0</div>
    <h1>BTCUSDT Perpetual · 1h</h1>
    <p>Binance USD-M public kline data · Lightweight Charts 5.2.1</p>
  </div>
  <a href="index.html">← Order Flow</a>
</header>
<div id="chart" aria-label="BTCUSDT perpetual one hour candlestick chart"></div>
<div id="status" class="status">Loading Binance 1h candles…</div>
</main>
<script
  src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"
  integrity="sha384-KkYqTZlM13Zya6fVUF3IGCBOQ1ehFeJVVgxaVvD/0MebineF9EI8Jkd3NnWNChqN"
  crossorigin="anonymous"></script>
<script src="web/chart/main.js"></script>
</body>
</html>
