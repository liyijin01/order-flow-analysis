name: D6 depth diagnostic

on:
  push:
    branches: [d6-flow-board]
    paths:
      - 'scripts/d6_depth_diagnose.py'
      - '.github/workflows/d6-depth-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inspect ETH bookDepth price validation
        run: python scripts/d6_depth_diagnose.py
