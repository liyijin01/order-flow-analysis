name: D6 depth validation diagnostic

on:
  push:
    branches: [d6-flow-board]
    paths:
      - '.github/workflows/d6-clean-window.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Diagnose 21-day ETH depth validation
        run: |
          python - <<'PY'
          import json, tempfile
          from datetime import date, timedelta
          from pathlib import Path
          from scripts.d6_build_flow_snapshot import ensure_depth_day

          rules=json.loads(Path('config/flow-rules.json').read_text())
          end=date(2026,9,28)
          start=end-timedelta(days=21)
          with tempfile.TemporaryDirectory(prefix='d6-diag-') as td:
              root=Path(td)
              total_rejected=total=0
              for i in range(21):
                  day=start+timedelta(days=i)
                  status,payload,error=ensure_depth_day('ETHUSDT',day,root/'data',root/'tmp',rules)
                  if not payload:
                      print(day,status,error)
                      continue
                  rejected=int(payload.get('rejected',0))
                  count=int(payload.get('totalSnapshots',0))
                  total_rejected+=rejected;total+=count
                  print(day,'rejected',rejected,'/',count,'reasons',payload.get('reasons'),'samples',payload.get('rejectedSamples'))
              print('TOTAL',total_rejected,'/',total,'pct',total_rejected/total*100 if total else None)
          PY
