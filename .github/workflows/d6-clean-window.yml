name: D6 depth field diagnostic

on:
  push:
    branches: [d6-flow-board]
    paths:
      - '.github/workflows/d6-clean-window.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare raw depth average price with 1m close
        run: |
          python - <<'PY'
          import csv, tempfile
          from datetime import date
          from pathlib import Path
          from scripts.d6_build_flow_snapshot import archive_url, csv_from_zip, load_kline_day
          from pipeline.vision import download_verified_url
          from pipeline.depth import normalize_epoch_ms

          with tempfile.TemporaryDirectory(prefix='d6-field-') as td:
              temp=Path(td)
              for ds in ('2026-09-07','2026-09-08','2026-09-10','2026-09-11','2026-09-12'):
                  day=date.fromisoformat(ds)
                  url=archive_url('bookDepth','ETHUSDT',day)
                  result=download_verified_url(url,temp,url.rsplit('/',1)[-1])
                  if result.status!='ok':
                      print(ds,'book',result.status,result.error);continue
                  stream=csv_from_zip(result.zip_path)
                  rows=list(csv.reader(stream))
                  header=[x.strip().lower() for x in rows[0]]
                  ti,pi,di,ni=[header.index(x) for x in ('timestamp','percentage','depth','notional')]
                  first_ts=normalize_epoch_ms(rows[1][ti])
                  snap=[r for r in rows[1:] if normalize_epoch_ms(r[ti])==first_ts]
                  st,klines,err=load_kline_day('ETHUSDT',day,'um','1m',temp)
                  minute=(first_ts//1000)//60*60
                  close=next((b['close'] for b in klines if b['time']==minute),None)
                  print('\nDAY',ds,'ts',rows[1][ti],'close',close)
                  for r in snap:
                      pct=float(r[pi])
                      if abs(pct) in (1,2,5):
                          depth=float(r[di]);notional=float(r[ni]);avg=notional/depth if depth else None
                          dev=abs(avg-close)/close*100 if avg and close else None
                          print('pct',pct,'depth',depth,'notional',notional,'avg',avg,'devPct',dev,'threshold',abs(pct)+0.5)
                  result.zip_path.unlink(missing_ok=True)
          PY
