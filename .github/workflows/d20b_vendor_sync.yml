name: D20b temporary pinned chart bundle vendor

on:
  push:
    branches: [refactor-d20b-perf]

permissions:
  contents: write

jobs:
  vendor-lightweight-charts:
    if: "!contains(github.event.head_commit.message, 'chore(d20b): vendor pinned chart bundle')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-d20b-perf
          fetch-depth: 0
      - name: Download exact 5.2.1 standalone bundle and verify fixed SRI
        run: |
          set -euo pipefail
          target=web/vendor/lightweight-charts-5.2.1.standalone.production.js
          if [ -s "$target" ]; then
            echo 'Pinned bundle already present'
            exit 0
          fi
          mkdir -p web/vendor
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js' \
            --output "$target"
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          source=Path("web/vendor/lightweight-charts-5.2.1.standalone.production.js").read_bytes()
          digest=base64.b64encode(hashlib.sha384(source).digest()).decode("ascii")
          expected="KkYqTZlM13Zya6fVUF3IGCBOQ1ehFeJVVgxaVvD/0MebineF9EI8Jkd3NnWNChqN"
          if digest!=expected:
              raise SystemExit("Pinned chart asset failed SRI verification")
          print("Pinned Lightweight Charts 5.2.1 verified, bytes=",len(source))
          PY
      - name: Commit verified bundle to PR branch
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- web/vendor)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/vendor
            git commit -m 'chore(d20b): vendor pinned chart bundle'
            git push origin HEAD:refactor-d20b-perf
          fi
