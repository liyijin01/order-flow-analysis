name: D1 Monthly Definition Probe
on:
  push:
    branches: [d1-analysis-board]
    paths:
      - 'scripts/d1_monthly_probe.py'
      - '.github/workflows/d1-monthly-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe November 2025 monthly value-area definitions
        run: python scripts/d1_monthly_probe.py --out d1-monthly-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-monthly-definition-probe
          path: d1-monthly-probe.json
          if-no-files-found: warn
          retention-days: 14
