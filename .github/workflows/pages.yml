name: Deploy Order Flow Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'web/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python unit tests
        run: python -m unittest discover pipeline/tests

      - name: JavaScript unit tests
        run: node --test web/tests/*.test.mjs

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pages is enabled
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance
          key: binance-aggtrades-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            binance-aggtrades-${{ runner.os }}-

      - name: Build weekly VP
        run: python -m pipeline.build

      - name: Prepare static site
        run: |
          mkdir -p _site/web
          cp index.html _site/index.html
          cp web/core.js _site/web/core.js
          cp weekly-vp.json _site/weekly-vp.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
