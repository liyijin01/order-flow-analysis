name: Test, Build Data, and Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'analysis.html'
      - 'flow.html'
      - 'chart.html'
      - 'config/**'
      - 'web/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Python unit tests
        run: python -m unittest discover pipeline/tests -v

      - name: C4.1 golden-standard archive checks
        if: github.event_name == 'pull_request'
        run: python scripts/c4_1_golden.py

      - name: JavaScript unit tests
        run: node --test web/tests/*.test.mjs

      - name: JavaScript syntax checks
        run: |
          node --check web/core.js
          node --check web/live.js
          node --check web/render.js
          node --check web/app.js
          find web/chart web/analysis web/flow -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ban large-array argument spreading
        run: |
          if grep -R -E 'Math\.(min|max)\(\.\.\.' web; then
            echo 'Math.min/max argument spreading is forbidden.' >&2
            exit 1
          fi

  chart-smoke:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'c2-') || startsWith(github.head_ref, 'c4-1-') || startsWith(github.head_ref, 'd6-') || startsWith(github.head_ref, 'd7-') || startsWith(github.head_ref, 'd7-'))
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/order-flow-http.log 2>&1 &
          sleep 2
      - name: Render C2.1-C4 regression suite
        if: startsWith(github.head_ref, 'c2-') || startsWith(github.head_ref, 'd6-') || startsWith(github.head_ref, 'd7-')
        run: node scripts/c2_1_c4_smoke.cjs
      - name: Run C4.1 browser regression checks
        if: startsWith(github.head_ref, 'c4-1-') || startsWith(github.head_ref, 'd6-') || startsWith(github.head_ref, 'd7-')
        run: node scripts/c4_1_smoke.cjs
      - name: Upload C2.1-C4 screenshots
        if: always() && (startsWith(github.head_ref, 'c2-') || startsWith(github.head_ref, 'd6-') || startsWith(github.head_ref, 'd7-'))
        uses: actions/upload-artifact@v7
        with:
          name: c2-1-c4-chart-screenshots
          path: c2-1-c4-smoke-artifacts/
          if-no-files-found: error
          retention-days: 7

  analysis-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Attach persistent data branch
        run: |
          git fetch origin data
          git worktree add --detach datarepo origin/data
      - name: Build exact weekly profiles
        run: python -m pipeline.build --data-dir datarepo --output-dir _d1-generated
      - name: Build real archived analysis snapshots
        run: python scripts/d1_build_snapshot.py --profile-dir _d1-generated --output-dir _site/analysis/data
      - name: Prepare local D1 site
        run: |
          mkdir -p _site/web _site/config
          cp analysis.html _site/
          cp -R web/analysis _site/web/
          cp config/symbols.js config/analysis-rules.json _site/config/
          cp _d1-generated/profiles-*.json _site/
      - name: Start local D1 site
        run: |
          python3 -m http.server 8000 --directory _site >/tmp/d1-http.log 2>&1 &
          sleep 2
      - name: Browser regression
        run: node scripts/d1_smoke.cjs
      - name: Generate nine real-market review PNGs
        env:
          ANALYSIS_PNG_DIR: _d1-artifacts/png
          ANALYSIS_LATEST: _d1-artifacts/latest.json
        run: node scripts/d1_daily_png.cjs
      - name: Upload D1 real-market screenshots
        uses: actions/upload-artifact@v7
        with:
          name: d1-analysis-real-market-screenshots
          path: _d1-artifacts/
          if-no-files-found: error
          retention-days: 14

  flow-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Attach persistent data branch
        run: |
          git fetch origin data
          git worktree add --detach datarepo origin/data
      - name: Build exact weekly profiles
        run: python -m pipeline.build --data-dir datarepo --output-dir _d6-generated
      - name: Build analysis snapshot for quarter AVWAP parity
        run: python scripts/d1_build_snapshot.py --profile-dir _d6-generated --output-dir _flow-site/analysis/data
      - name: Build real archived flow snapshot
        run: python scripts/d6_build_flow_snapshot.py --data-dir datarepo --output-dir _flow-site/flow/data
      - name: Prepare local flow site
        run: |
          mkdir -p _flow-site/web _flow-site/config
          cp flow.html _flow-site/
          cp -R web/analysis web/chart web/flow _flow-site/web/
          cp config/symbols.js config/flow-rules.json _flow-site/config/
      - name: Start local flow site
        run: |
          python3 -m http.server 8000 --directory _flow-site >/tmp/d6-http.log 2>&1 &
          sleep 2
      - name: Flow browser regression
        run: node scripts/d6_smoke.cjs
      - name: Generate six real-market flow PNGs
        env:
          FLOW_PNG_DIR: _d6-artifacts/png
          FLOW_LATEST: _d6-artifacts/latest.json
        run: node scripts/d6_flow_png.cjs
      - name: Upload D6 real-market screenshots
        uses: actions/upload-artifact@v7
        with:
          name: d6-flow-real-market-screenshots
          path: _d6-artifacts/
          if-no-files-found: error
          retention-days: 14

  data:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare orphan data branch worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf datarepo
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add -B data datarepo origin/data
          else
            git worktree add --detach datarepo
            cd datarepo
            git checkout --orphan data
            git rm -rf . || true
            printf '%s\n' 'Persistent daily Binance Vision ladders. Generated by GitHub Actions.' > .data-branch
            git add .data-branch
            git commit -m 'data: initialize orphan branch'
            git push origin HEAD:data
            cd ..
          fi

      - name: Build missing daily ladders and exact weekly profiles
        run: python -m pipeline.build --data-dir datarepo --output-dir _generated

      - name: Build archived flow snapshot and persistent depth
        run: python scripts/d6_build_flow_snapshot.py --data-dir datarepo --output-dir _generated/flow/data

      - name: Persist new ladders and sampled depth to data branch
        shell: bash
        run: |
          set -euo pipefail
          cd datarepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d depth ]; then
            git rm -r --quiet depth
          fi
          git add ladders depth15m .data-branch 2>/dev/null || git add ladders depth15m
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh daily ladders and sampled depth'
            git push origin HEAD:data
          fi

      - name: Build archived analysis snapshots
        run: python scripts/d1_build_snapshot.py --profile-dir _generated --output-dir _generated/analysis/data

      - name: Upload generated market data
        uses: actions/upload-artifact@v7
        with:
          name: generated-market-data
          path: |
            _generated/profiles-*.json
            _generated/analysis/data/*.json
            _generated/flow/data/*.json
          if-no-files-found: error
          retention-days: 1

  build:
    if: github.event_name != 'pull_request'
    needs: data
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Pages is enabled
        uses: actions/configure-pages@v6
      - name: Download generated market data
        uses: actions/download-artifact@v8
        with:
          name: generated-market-data
          path: _generated
      - name: Prepare static site
        run: |
          mkdir -p _site/web _site/config _site/analysis/data _site/flow/data
          cp index.html chart.html analysis.html flow.html _site/
          cp web/core.js web/live.js web/render.js web/app.js _site/web/
          cp -R web/chart web/analysis web/flow _site/web/
          cp config/symbols.js config/analysis-rules.json config/annotation-rules.json config/flow-rules.json _site/config/
          cp _generated/profiles-*.json _site/
          cp _generated/analysis/data/*.json _site/analysis/data/
          cp _generated/flow/data/*.json _site/flow/data/
          touch _site/.nojekyll
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Start snapshot site
        run: |
          python3 -m http.server 8000 --directory _site >/tmp/d1-pages-http.log 2>&1 &
          sleep 2
      - name: Generate daily analysis PNGs
        env:
          ANALYSIS_PNG_DIR: _site/analysis/png
          ANALYSIS_LATEST: _site/analysis/latest.json
        run: node scripts/d1_daily_png.cjs
      - name: Generate daily flow PNGs
        env:
          FLOW_PNG_DIR: _site/flow/png
          FLOW_LATEST: _site/flow/latest.json
        run: node scripts/d6_flow_png.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
