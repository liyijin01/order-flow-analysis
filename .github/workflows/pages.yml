name: Test, Build Data, and Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'chart.html'
      - 'config/**'
      - 'web/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 1,9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python unit tests
        run: python -m unittest discover pipeline/tests -v

      - name: JavaScript unit tests
        run: node --test web/tests/*.test.mjs

      - name: JavaScript syntax checks
        run: |
          node --check web/core.js
          node --check web/live.js
          node --check web/render.js
          node --check web/app.js
          for f in web/chart/*.js; do node --check "$f"; done

      - name: Ban large-array argument spreading
        run: |
          if grep -R -E 'Math\.(min|max)\(\.\.\.' web; then
            echo 'Math.min/max argument spreading is forbidden.' >&2
            exit 1
          fi

  chart-smoke:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'c1-')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0

      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/order-flow-http.log 2>&1 &
          echo $! > /tmp/order-flow-http.pid
          sleep 2

      - name: Export BTC ETH SOL 1h PNGs
        run: node scripts/c1_smoke.cjs

      - name: Upload C1 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-chart-screenshots
          path: c1-smoke-artifacts/
          if-no-files-found: error
          retention-days: 7

  data:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare orphan data branch worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf datarepo
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add -B data datarepo origin/data
          else
            git worktree add --detach datarepo
            cd datarepo
            git checkout --orphan data
            git rm -rf . || true
            printf '%s\n' 'Persistent daily Binance Vision ladders. Generated by GitHub Actions.' > .data-branch
            git add .data-branch
            git commit -m 'data: initialize orphan branch'
            git push origin HEAD:data
            cd ..
          fi

      - name: Build missing daily ladders and profiles
        run: python -m pipeline.build --data-dir datarepo --output-dir _generated

      - name: Persist new ladders to data branch
        shell: bash
        run: |
          set -euo pipefail
          cd datarepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ladders .data-branch 2>/dev/null || git add ladders
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh daily ladders'
            git push origin HEAD:data
          fi

      - name: Upload generated profiles
        uses: actions/upload-artifact@v4
        with:
          name: archive-profiles
          path: _generated/profiles-*.json
          if-no-files-found: error
          retention-days: 1

  build:
    if: github.event_name != 'pull_request'
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify Pages is enabled
        uses: actions/configure-pages@v5

      - name: Download generated profiles
        uses: actions/download-artifact@v4
        with:
          name: archive-profiles
          path: _generated

      - name: Prepare static site
        run: |
          mkdir -p _site/web/chart _site/config
          cp index.html _site/index.html
          cp chart.html _site/chart.html
          cp web/core.js web/live.js web/render.js web/app.js _site/web/
          cp web/chart/*.js _site/web/chart/
          cp config/symbols.js _site/config/symbols.js
          cp _generated/profiles-*.json _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
