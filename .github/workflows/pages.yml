name: Deploy Order Flow Dashboard
# static browser dashboard + verified Binance Vision weekly VP

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance
          key: binance-aggtrades-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            binance-aggtrades-${{ runner.os }}-

      - name: Build weekly VP
        run: python scripts/build_weekly.py

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp weekly-vp.json _site/weekly-vp.json
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
