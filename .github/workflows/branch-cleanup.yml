name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete verified merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            phase-0-refactor-tests
            phase-1-2-hardening
            c0-chart-skeleton
            c1-chart-basics
            c2-annotation-renderer
            c2-1-c3-c4
            c4-1-annotation-fixes
            d1-analysis-board
            d2-board-fixes
            d3-switch-autoscale
            d4-board-robustness
            d5-board-polish
          )
          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
