name: C4.1 Golden Probe
on:
  push:
    branches: [c4-1-annotation-fixes]
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run C4.1 golden-standard archive checks
        run: python scripts/c4_1_golden.py
