name: D6 data probe
on:
  push:
    branches: [d6-flow-board]
    paths:
      - 'scripts/d6_probe.py'
      - '.github/workflows/d6-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Probe Binance Vision bookDepth and klines
        run: python scripts/d6_probe.py
      - name: Upload D6 probe
        uses: actions/upload-artifact@v7
        with:
          name: d6-data-probe
          path: |
            d6-probe.json
            d6-probe.md
          if-no-files-found: error
          retention-days: 14
